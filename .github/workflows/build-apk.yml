name: Build Lezzwatch APK

# Builds a debug APK automatically on every push, and lets you trigger a build manually
# from the Actions tab. GitHub's runners have full internet access to the Google/Maven
# repositories this project needs — unlike the sandbox this project was scaffolded in — so
# this is the easiest way to get an installable .apk without setting up Android Studio.
#
# After a run finishes: Actions tab -> the run -> "lezzwatch-debug-apk" under Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        continue-on-error: true # in case the wrapper jar isn't committed, see fallback below

      - name: Ensure Gradle wrapper jar exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lezzwatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
